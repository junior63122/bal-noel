services:
  - type: web
    name: bal-noel
    runtime: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
